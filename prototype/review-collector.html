<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trustpilot — conversational review collection</title>
<meta name="description" content="Prototype: conversational product review collection that asks the questions a static form can't.">
<style>
  :root{
    --bg:#faf9f5; --ink:#181818; --rule:#e8e7e3; --rule-2:#d8d7d4;
    --muted:#646362; --muted-2:#898987;
    --green:#00b579; --green-deep:#00754e; --green-wash:#eaf7f1;
    --card:#ffffff; --dark:#181818;
    --fs-1:27px; --fs-2:17px; --fs-3:15.5px; --fs-4:13px;
    --maxw:620px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0;overscroll-behavior-y:none}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:var(--fs-3); line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }

  /* ── header ───────────────────────────────────────────── */
  header{
    flex:none; border-bottom:1px solid var(--rule); background:rgba(250,249,245,.93);
    backdrop-filter:saturate(1.6) blur(10px); position:sticky; top:0; z-index:5;
  }
  .hd{max-width:var(--maxw);margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-deep);font-weight:700}
  .brand svg{width:12px;height:12px;flex:none}
  .modebar{display:flex;gap:3px;background:var(--rule);padding:3px;border-radius:999px}
  .modebar button{
    appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;
    font-size:11.5px;font-weight:600;color:var(--muted);padding:5px 10px;border-radius:999px;white-space:nowrap;
  }
  .modebar button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .modebar button:focus-visible{outline:2px solid var(--green-deep);outline-offset:2px}

  /* ── thread ───────────────────────────────────────────── */
  main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .thread{max-width:var(--maxw);margin:0 auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:14px}

  .subject{
    display:flex;gap:12px;align-items:center;background:var(--card);
    border:1px solid var(--rule);border-radius:14px;padding:12px 14px;
  }
  .thumb{width:42px;height:42px;flex:none;border-radius:9px;background:var(--green-wash);display:grid;place-items:center;font-size:20px}
  .subject h1{font-size:var(--fs-3);margin:0 0 1px;font-weight:650;letter-spacing:-.01em}
  .subject p{margin:0;font-size:var(--fs-4);color:var(--muted)}
  .vbadge{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:10.5px;font-weight:700;
    color:var(--green-deep);background:var(--green-wash);padding:2px 7px;border-radius:999px}

  .msg{display:flex;gap:9px;align-items:flex-end;animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
  .msg .av{
    width:25px;height:25px;flex:none;border-radius:50%;background:var(--dark);
    display:grid;place-items:center;margin-bottom:1px;
  }
  .msg .av svg{width:12px;height:12px;color:var(--green)}
  .bub{
    max-width:min(82%,460px);padding:11px 15px;border-radius:17px;
    background:var(--card);border:1px solid var(--rule);border-bottom-left-radius:5px;
  }
  .bub p{margin:0}
  .bub p + p{margin-top:7px;font-size:var(--fs-4);color:var(--muted);line-height:1.5}
  .msg.me{justify-content:flex-end}
  .msg.me .bub{
    background:var(--dark);color:#fff;border-color:var(--dark);
    border-bottom-left-radius:17px;border-bottom-right-radius:5px;font-weight:500;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .typing{display:flex;gap:4px;padding:3px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted-2);animation:blip 1.3s infinite}
  .typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blip{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ── quick replies ────────────────────────────────────── */
  .replies{display:flex;flex-wrap:wrap;gap:7px;padding-left:34px;animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
  .chip{
    appearance:none;font:inherit;font-size:var(--fs-3);cursor:pointer;background:var(--card);
    border:1px solid var(--rule-2);color:var(--ink);padding:9px 14px;border-radius:999px;transition:all .13s;
  }
  .chip:hover{border-color:var(--muted-2)}
  .chip:focus-visible{outline:2px solid var(--green-deep);outline-offset:2px}
  .chip[aria-pressed="true"]{background:var(--green-wash);border-color:var(--green);color:var(--green-deep);font-weight:650}
  .chip.go{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:650}
  .chip.go[disabled]{opacity:.4;cursor:not-allowed}
  .stars{display:flex;gap:6px;padding-left:34px;animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
  .stars button{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;width:42px;height:42px;border-radius:8px;transition:transform .12s}
  .stars button:hover{transform:scale(1.08)}
  .stars button:focus-visible{outline:2px solid var(--green-deep);outline-offset:2px}
  .stars svg{width:100%;height:100%;display:block}

  /* ── composer ─────────────────────────────────────────── */
  footer{flex:none;border-top:1px solid var(--rule);background:var(--bg);position:sticky;bottom:0}
  .cp{max-width:var(--maxw);margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .box{display:flex;align-items:flex-end;gap:7px;background:var(--card);border:1px solid var(--rule-2);border-radius:22px;padding:5px 5px 5px 15px}
  .box:focus-within{border-color:var(--muted-2);box-shadow:0 0 0 3px rgba(0,181,121,.1)}
  .box textarea{
    flex:1;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:var(--fs-3);
    color:var(--ink);padding:8px 0;max-height:120px;line-height:1.45;
  }
  .box textarea::placeholder{color:var(--muted-2)}
  .ico{
    appearance:none;border:0;cursor:pointer;width:34px;height:34px;flex:none;border-radius:50%;
    display:grid;place-items:center;transition:all .13s;background:transparent;color:var(--muted);
  }
  .ico:hover{background:var(--rule)}
  .ico:focus-visible{outline:2px solid var(--green-deep);outline-offset:1px}
  .ico svg{width:17px;height:17px}
  .ico.send{background:var(--dark);color:#fff}
  .ico.send:hover{background:#000}
  .ico.send[disabled]{opacity:.3;cursor:not-allowed;background:var(--rule-2);color:var(--muted)}
  .ico.mic.live{background:var(--green);color:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,181,121,.5)}70%{box-shadow:0 0 0 9px rgba(0,181,121,0)}}
  .hint{font-size:10.5px;color:var(--muted-2);text-align:center;margin:7px 0 0;line-height:1.45}

  /* ── payload ──────────────────────────────────────────── */
  .done{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:19px;margin-left:34px}
  .done h2{font-size:var(--fs-1);line-height:1.15;letter-spacing:-.025em;margin:0 0 6px;font-weight:700}
  .done .lede{color:var(--muted);margin:0 0 18px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
  .stat{background:var(--bg);border-radius:11px;padding:12px}
  .stat b{display:block;font-size:23px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
  .stat span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .note{background:var(--green-wash);border-radius:11px;padding:13px 15px;font-size:var(--fs-4);color:var(--green-deep);line-height:1.55;margin-bottom:16px}
  .payhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .payhead h3{font-size:var(--fs-4);margin:0;font-weight:700}
  .payhead span{font-size:10.5px;color:var(--muted)}
  pre{margin:0 0 16px;background:var(--dark);color:#e8e7e3;border-radius:11px;padding:15px;overflow-x:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.65}
  pre .k{color:#7fd4ad} pre .s{color:#f2d5a0} pre .n{color:#a8c7fa}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{appearance:none;font:inherit;font-size:var(--fs-3);font-weight:650;cursor:pointer;padding:11px 18px;border-radius:999px;border:1px solid transparent;transition:all .13s}
  .btn-pri{background:var(--dark);color:#fff} .btn-pri:hover{background:#000}
  .btn-sec{background:transparent;color:var(--ink);border-color:var(--rule-2)} .btn-sec:hover{border-color:var(--muted-2)}
  .btn:focus-visible{outline:2px solid var(--green-deep);outline-offset:2px}
  .status{font-size:var(--fs-4);margin:9px 0 0;min-height:18px}
  .status.ok{color:var(--green-deep);font-weight:650}
  .status.err{color:#9a3412;font-weight:650}

  @media (prefers-reduced-motion:reduce){
    .msg,.replies,.stars{animation:none} .typing i{animation:none;opacity:.6} .ico.mic.live{animation:none}
  }
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.6l3.1 7.3 7.9.6-6 5.2 1.8 7.7L12 18.3l-6.8 4.1 1.8-7.7-6-5.2 7.9-.6z"/></svg>
      Prototype
    </div>
    <div class="modebar" role="group" aria-label="What are you reviewing?">
      <button type="button" data-mode="sneaker" aria-pressed="true">A product</button>
      <button type="button" data-mode="deck" aria-pressed="false">This presentation</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="thread" id="thread" aria-live="polite" aria-label="Review conversation"></div>
</main>

<footer>
  <div class="cp">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Type a reply…" aria-label="Your reply"></textarea>
      <button type="button" class="ico mic" id="mic" title="Answer by voice" aria-label="Answer by voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>
        </svg>
      </button>
      <button type="button" class="ico send" id="send" disabled title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
    <p class="hint" id="hint">Tap an option, or type — you can speak your answer too.</p>
  </div>
</footer>

<script>
/* ════════════════════════════════════════════════════════════════════════
   CONFIG — paste your Apps Script Web App URL here (see prototype/README).
   Leave "" and the prototype falls back to copy / download.
   ════════════════════════════════════════════════════════════════════════ */
const FORM_ENDPOINT = "https://script.google.com/macros/s/AKfycby4PvLfZ1dSm8TopuK_zgaAvkMSVsoBbsEgFOwq3dTE5anosGZPrE2MF5tzsjZoD1Rs/exec";

/* ── Subjects ────────────────────────────────────────────────────────────
   Same engine, different generated questions. That contrast IS the demo —
   no static form could ask either set.
   type: "scale" (single choice) | "multi" (multi-select) | "open" (free text)
   ─────────────────────────────────────────────────────────────────────── */
const SUBJECTS = {
  sneaker:{
    icon:"👟", id:"trailwind-gt-3",
    name:"Trailwind GT-3 — Women's Walking Shoe",
    seller:"Sold by Northfield Running", verified:true, category:"footwear / walking",
    hello:"Hi — thanks for buying the Trailwind GT-3. Mind if I ask a few quick things? It takes under a minute.",
    variantAsk:"First — which one did you get?",
    variantWhy:"Tagging the variant is what makes “runs small” useful to anyone else.",
    variants:["UK 5 · Slate","UK 6 · Slate","UK 6 · Sand","UK 7 · Sand","UK 8 · Slate"],
    overall:"How were they overall?",
    overallWhy:"One tap. You can stop right there if you want.",
    qs:[
      {key:"use_case", type:"multi", ask:"What have you mainly used them for?",
       why:"Pick as many as apply.",
       opts:["City walking","Commuting","Travel","Light trails","Standing all day","The gym"]},
      {key:"sizing_accuracy", type:"scale", ask:"How did the sizing compare to what you expected?",
       why:"Fit is the most common reason walking shoes get sent back.",
       opts:["Runs small","Slightly small","True to size","Slightly large","Runs large"]},
      {key:"wet_grip", type:"scale", ask:"And the grip on wet pavement?",
       why:"You bought these for London, so this one matters.",
       opts:["Slipped","A bit uncertain","Fine","Confident","Excellent"]},
      {key:"comfort_over_distance", type:"scale", ask:"After a few hours of walking, how did your feet feel?",
       why:"Comfort at hour three tells you more than comfort on the first wear.",
       opts:["Painful","Sore","Okay","Good","No issues at all"]},
      {key:"comment", type:"open", ask:"Last one — what would you tell someone considering these?",
       why:"A sentence is plenty. Speak it if that's easier."}
    ]
  },
  deck:{
    icon:"📊", id:"trust-layer-strategy",
    name:"Expanding the trust layer to product reviews",
    seller:"A 12–18 month strategy · Michelle Muller", verified:false, category:"strategy / presentation",
    hello:"Thanks for going through the deck. A few quick questions — under a minute, and please be blunt.",
    variantAsk:"How did you see it?",
    variantWhy:"Reading it and being walked through it are different experiences.",
    variants:["Presented live","Read it myself","A bit of both"],
    overall:"Overall, how did it land?",
    overallWhy:"One tap. You can stop right there if you want.",
    qs:[
      {key:"strongest_parts", type:"multi", ask:"Which parts landed best?",
       why:"Pick as many as apply.",
       opts:["The thesis","The evidence","The two bets","The trade-offs","The roadmap","The metrics"]},
      {key:"argument_clarity", type:"scale", ask:"How clear was the central argument?",
       why:"If the thesis doesn't land, nothing after it does either.",
       opts:["Lost me","Patchy","Clear enough","Clear","Very clear"]},
      {key:"evidence_strength", type:"scale", ask:"How well did the evidence support the claims?",
       why:"Strategy decks live or die on whether the proof holds.",
       opts:["Thin","Some gaps","Adequate","Solid","Convincing"]},
      {key:"plan_feasibility", type:"scale", ask:"Does the 18-month plan feel achievable?",
       why:"Ambition is easy; sequencing is the hard part.",
       opts:["No","Doubtful","Maybe","Mostly","Yes"]},
      {key:"comment", type:"open", ask:"Last one — what's the weakest part?",
       why:"Be blunt, that's the useful bit. Speak it if that's easier."}
    ]
  }
};

/* ── Elements & state ───────────────────────────────────────────────── */
const $thread=document.getElementById("thread"), $main=document.getElementById("main"),
      $input=document.getElementById("input"), $send=document.getElementById("send"),
      $mic=document.getElementById("mic"), $hint=document.getElementById("hint");

let mode="sneaker", S, t0=Date.now(), onText=null, A;

const reset = () => { A={variant:null,overall:null,answers:{},freeform:{}}; };
const scroll = () => requestAnimationFrame(()=> $main.scrollTo({top:$main.scrollHeight,behavior:"smooth"}));
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ── Thread rendering ───────────────────────────────────────────────── */
const BOT_AV = `<div class="av"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.6l3.1 7.3 7.9.6-6 5.2 1.8 7.7L12 18.3l-6.8 4.1 1.8-7.7-6-5.2 7.9-.6z"/></svg></div>`;

function node(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); const el=d.firstElementChild; $thread.appendChild(el); scroll(); return el; }

async function bot(text, sub){
  const t = node(`<div class="msg">${BOT_AV}<div class="bub"><div class="typing"><i></i><i></i><i></i></div></div></div>`);
  await wait(Math.min(950, 320 + text.length * 11));
  t.querySelector(".bub").innerHTML = `<p>${text}</p>` + (sub ? `<p>${sub}</p>` : "");
  scroll();
}
const me = text => node(`<div class="msg me"><div class="bub"><p>${text}</p></div></div>`);

/* ── Composer ───────────────────────────────────────────────────────── */
function composer(enabled, placeholder){
  $input.disabled = !enabled;
  $input.placeholder = placeholder || "Type a reply…";
  $mic.disabled = !enabled || !SR;
  $send.disabled = true;
  $input.style.height = "auto";
  if(enabled) requestAnimationFrame(()=> $input.focus({preventScroll:true}));
}
$input.addEventListener("input", ()=>{
  $send.disabled = !$input.value.trim();
  $input.style.height="auto"; $input.style.height = Math.min(120,$input.scrollHeight)+"px";
});
$input.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); if(!$send.disabled) $send.click(); }
});
$send.onclick = ()=>{
  const v=$input.value.trim(); if(!v) return;
  $input.value=""; $input.style.height="auto"; $send.disabled=true;
  if(onText) onText(v);
};

/* ── Voice ──────────────────────────────────────────────────────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, listening=false;
if(!SR){ $mic.hidden = true; }
else{
  rec = new SR(); rec.lang="en-GB"; rec.interimResults=true; rec.continuous=false;
  let base="";
  rec.onresult = e=>{
    let txt="";
    for(let i=e.resultIndex;i<e.results.length;i++) txt += e.results[i][0].transcript;
    $input.value = (base ? base+" " : "") + txt;
    $send.disabled = !$input.value.trim();
    $input.style.height="auto"; $input.style.height=Math.min(120,$input.scrollHeight)+"px";
  };
  rec.onend = ()=>{ listening=false; $mic.classList.remove("live"); $mic.setAttribute("aria-label","Answer by voice"); };
  rec.onerror = ev=>{
    listening=false; $mic.classList.remove("live");
    if(ev.error==="not-allowed") $hint.textContent="Microphone blocked — allow access, or just type.";
  };
  $mic.onclick = ()=>{
    if(listening){ rec.stop(); return; }
    base = $input.value.trim();
    try{
      rec.start(); listening=true;
      $mic.classList.add("live"); $mic.setAttribute("aria-label","Stop listening");
      $hint.textContent="Listening… tap the mic again to stop.";
    }catch(_){}
  };
}

/* ── Question steps ─────────────────────────────────────────────────── */
function replies(opts, onPick){
  const el = node(`<div class="replies">${opts.map((o,i)=>`<button type="button" class="chip" data-i="${i}">${o}</button>`).join("")}</div>`);
  el.querySelectorAll(".chip").forEach(b=> b.onclick = ()=>{ el.remove(); onPick(+b.dataset.i); });
  return el;
}

function multi(opts, onDone){
  const picked = new Set();
  const el = node(`<div class="replies">
    ${opts.map((o,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="false">${o}</button>`).join("")}
    <button type="button" class="chip go" data-go disabled>Continue</button>
  </div>`);
  const go = el.querySelector("[data-go]");
  el.querySelectorAll(".chip:not(.go)").forEach(b=> b.onclick = ()=>{
    const i=+b.dataset.i;
    picked.has(i) ? picked.delete(i) : picked.add(i);
    b.setAttribute("aria-pressed", String(picked.has(i)));
    go.disabled = picked.size===0;
    go.textContent = picked.size ? `Continue (${picked.size})` : "Continue";
  });
  go.onclick = ()=>{ el.remove(); onDone([...picked].sort().map(i=>opts[i])); };
}

function stars(onPick){
  const svg = f => `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="${f?'var(--green)':'#e2e1dd'}" d="M12 1.6l3.1 7.3 7.9.6-6 5.2 1.8 7.7L12 18.3l-6.8 4.1 1.8-7.7-6-5.2 7.9-.6z"/></svg>`;
  const el = node(`<div class="stars" role="group" aria-label="Rating out of 5">
    ${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n} out of 5">${svg(false)}</button>`).join("")}</div>`);
  const btns=[...el.querySelectorAll("button")];
  const paint = n => btns.forEach((b,i)=> b.innerHTML = svg(i<n));
  btns.forEach(b=>{
    b.onmouseenter=()=>paint(+b.dataset.n); b.onfocus=()=>paint(+b.dataset.n);
    b.onclick=()=>{ el.remove(); onPick(+b.dataset.n); };
  });
  el.onmouseleave=()=>paint(0);
}

/* ── Flow ───────────────────────────────────────────────────────────── */
async function run(){
  reset(); t0=Date.now(); onText=null;
  $thread.innerHTML = `
    <div class="subject">
      <div class="thumb" aria-hidden="true">${S.icon}</div>
      <div><h1>${S.name}</h1><p>${S.seller}</p>
      ${S.verified?`<span class="vbadge">✓ Verified purchase</span>`:``}</div>
    </div>`;
  composer(false, "Tap an option above…");

  await bot(S.hello);
  await bot(S.variantAsk, S.variantWhy);
  replies(S.variants, async i=>{
    A.variant = S.variants[i]; me(A.variant);
    await bot(S.overall, S.overallWhy);
    stars(async n=>{
      A.overall=n; me("★".repeat(n) + `  ${n}/5`);
      await bot("Thanks — that's logged.",
        `Add a little detail and it becomes something an AI can actually use. About thirty seconds.`);
      replies(["Add detail","I'm done"], async j=>{
        if(j===1){ me("I'm done"); return finish(true); }
        me("Add detail"); step(0);
      });
    });
  });
}

async function step(i){
  if(i >= S.qs.length) return finish(false);
  const q = S.qs[i];
  await bot(q.ask, q.why);

  if(q.type === "multi"){
    composer(true, "…or type your own");
    onText = v => { A.freeform[q.key]=v; me(v); onText=null; composer(false,"Tap an option above…"); step(i+1); };
    multi(q.opts, vals => { A.answers[q.key]={type:"multi",values:vals}; me(vals.join(" · ")); onText=null; composer(false,"Tap an option above…"); step(i+1); });

  } else if(q.type === "scale"){
    composer(true, "…or answer in your own words");
    onText = v => { A.answers[q.key]={type:"freeform",label:v,value:null}; me(v); onText=null; composer(false,"Tap an option above…"); step(i+1); };
    replies(q.opts, j => { A.answers[q.key]={type:"scale",label:q.opts[j],value:j+1,scale:5}; me(q.opts[j]); onText=null; composer(false,"Tap an option above…"); step(i+1); });

  } else { /* open */
    composer(true, "Type or tap the mic…");
    const skip = replies(["Skip"], ()=>{ me("Skip"); onText=null; composer(false); step(i+1); });
    onText = v => { A.answers[q.key]={type:"open",text:v}; me(v); skip.remove(); onText=null; composer(false); step(i+1); };
  }
}

/* ── Payload ────────────────────────────────────────────────────────── */
function payload(){
  const attributes=[], comments={};
  for(const [k,v] of Object.entries(A.answers)){
    if(v.type==="open"){ comments[k]=v.text; continue; }
    if(v.type==="multi") attributes.push({key:k, type:"multi", values:v.values});
    else if(v.type==="freeform") attributes.push({key:k, type:"freeform", label:v.label, value:null, note:"unmapped — a model would score this in production"});
    else attributes.push({key:k, type:"scale", value:v.value, scale:v.scale, label:v.label});
  }
  for(const [k,v] of Object.entries(A.freeform)) attributes.push({key:k, type:"freeform", label:v, value:null});
  return {
    subject:{ id:S.id, name:S.name, category:S.category },
    variant:A.variant,
    rating:{ value:A.overall, scale:5 },
    attributes,
    comment: comments.comment || null,
    provenance:{
      collected_by:"trustpilot",
      verified_purchase:S.verified,
      verification_level:S.verified?"invitation_linked_transaction":"unverified",
      source:"conversational_collector_v1",
      input_modes:[...new Set(["tap", ...(usedVoice?["voice"]:[]), ...(usedType?["text"]:[])])],
      collected_at:new Date().toISOString()
    }
  };
}
let usedVoice=false, usedType=false;
if(SR) $mic.addEventListener("click", ()=>{ usedVoice=true; });
$send.addEventListener("click", ()=>{ usedType=true; });

const colour = j => j.replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/"([^"]+)":/g,'<span class="k">"$1"</span>:')
  .replace(/: "([^"]*)"/g,': <span class="s">"$1"</span>')
  .replace(/: (\d+|true|false|null)/g,': <span class="n">$1</span>');

async function finish(early){
  composer(false, "Finished");
  $hint.textContent = "Thanks — that's everything.";
  const secs=Math.max(1,Math.round((Date.now()-t0)/1000)), p=payload(), json=JSON.stringify(p,null,2);
  const n=p.attributes.length;

  await bot(early ? "Logged — thank you." : "That's everything. Thank you.");

  const el = node(`<div class="done">
    <h2>${early ? "One tap, still usable." : "Here's what an agent would consume."}</h2>
    <p class="lede">${early
      ? "A variant-tagged, verified rating — from a single tap."
      : "Structured, variant-tagged, with provenance attached."}</p>
    <div class="stats">
      <div class="stat"><b>${secs}s</b><span>to complete</span></div>
      <div class="stat"><b>${n}</b><span>structured attribute${n===1?"":"s"}</span></div>
      <div class="stat"><b>${A.variant?"Yes":"No"}</b><span>variant tagged</span></div>
    </div>
    <div class="note"><b>Today's form would have captured:</b> a star rating and two optional
      generic attributes most people skip. No variant. No verified-purchase field.
      Nothing an agent can filter on.</div>
    <div class="payhead"><h3>Structured output</h3><span>what an agent queries</span></div>
    <pre><code>${colour(json)}</code></pre>
    <div class="row">
      <button type="button" class="btn btn-pri" data-send>${FORM_ENDPOINT?"Send":"Copy"}</button>
      <button type="button" class="btn btn-sec" data-dl>Download</button>
      <button type="button" class="btn btn-sec" data-again>Start again</button>
    </div>
    <p class="status" role="status"></p>
  </div>`);

  const st=el.querySelector(".status");
  const say=(m,ok=true)=>{ st.textContent=m; st.className="status "+(ok?"ok":"err"); };

  el.querySelector("[data-send]").onclick = async e=>{
    const b=e.currentTarget;
    if(!FORM_ENDPOINT){
      try{ await navigator.clipboard.writeText(json); say("Copied to clipboard."); }
      catch(_){ say("Select the output above to copy.",false); }
      return;
    }
    b.disabled=true; say("Sending…");
    try{
      await fetch(FORM_ENDPOINT,{ method:"POST", mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"}, body:json });
      say("Sent — thank you.");
    }catch(err){
      say("Couldn't send. Copied instead — please paste it over.",false);
      try{ await navigator.clipboard.writeText(json); }catch(_){}
      b.disabled=false;
    }
  };
  el.querySelector("[data-dl]").onclick = ()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
    a.download=`review-${p.subject.id}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000); say("Downloaded.");
  };
  el.querySelector("[data-again]").onclick = ()=> start(mode);
}

/* ── Boot ───────────────────────────────────────────────────────────── */
function start(m){
  mode=m; S=SUBJECTS[m]; usedVoice=false; usedType=false;
  $hint.textContent = SR ? "Tap an option, or type — you can speak your answer too."
                         : "Tap an option, or type your answer.";
  document.querySelectorAll(".modebar button").forEach(b=> b.setAttribute("aria-pressed", String(b.dataset.mode===m)));
  run();
}
document.querySelectorAll(".modebar button").forEach(b=> b.onclick = ()=> start(b.dataset.mode));
start("sneaker");
</script>
</body>
